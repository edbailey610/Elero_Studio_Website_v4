<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Enquiry sent — Elero Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 0%,rgba(100,220,255,.18),transparent 32%),#080b10;color:#fff;font-family:"DM Sans",sans-serif}
    .card{width:min(560px,100%);padding:34px;border:1px solid #222b35;border-radius:24px;background:#10151c;box-shadow:0 30px 80px rgba(0,0,0,.3)}
    .mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#b9f5ff,#67ddf9);color:#061117;font:800 21px Manrope,sans-serif}
    small{display:block;margin-top:25px;color:#687582;font-size:8px;font-weight:800;letter-spacing:.16em}
    h1{margin:9px 0 12px;font:800 clamp(38px,8vw,58px)/1 Manrope,sans-serif;letter-spacing:-.055em}
    p{margin:0;color:#8c97a3;line-height:1.65;font-size:13px}
    a{display:inline-flex;margin-top:24px;padding:12px 15px;border-radius:11px;background:#fff;color:#0a0d12;text-decoration:none;font-size:10px;font-weight:800}
  </style>
  <script src="/mobile-symbol-cleanup.js" defer></script>

</head>
<body>
  <main class="card">
    <div class="mark">E</div>
    <small>ELERO STUDIO</small>
    <h1>Enquiry sent.</h1>
    <p>Thanks for getting in touch. We’ve received your project details and will get back to you as soon as possible.</p>
    <a href="/">Return to the website →</a>
  </main>
</body>
</html>
